name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production smoke
        run: npm run smoke:prod
